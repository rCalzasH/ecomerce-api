$kind: http-request
name: GET Echo
method: GET
url: '{{baseURL}}/get?name=Pachi'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => { pm.response.to.have.status(200); });
      pm.test('Response time is below 2000ms', () => { pm.expect(pm.response.responseTime).to.be.below(2000); });
      pm.test('Response is a JSON object', () => { pm.response.to.be.json; pm.expect(pm.response.json()).to.be.an('object'); });
