$kind: http-request
name: POST Echo
method: POST
url: '{{baseURL}}/post'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {"message": "Hello Postman!"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', () => { pm.response.to.have.status(200); });
      pm.test('Response body has correct data field', () => { const json = pm.response.json(); pm.expect(json.data).to.eql('{"message": "Hello Postman!"}'); });
